name: Track upstream Open Terminal

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="$(gh api repos/open-webui/open-terminal/releases/latest --jq '.tag_name')"
          VERSION="${TAG#v}"

          CURRENT="$(awk -F'"' '/^version:/ {print $2; exit}' open-terminal/config.yaml)"

          echo "Current wrapper version: ${CURRENT}"
          echo "Latest upstream version: ${VERSION}"

          if [ "${VERSION}" = "${CURRENT}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Checking official GHCR image..."

          READY=0
          for attempt in $(seq 1 20); do
            if docker manifest inspect \
              "ghcr.io/open-webui/open-terminal:${VERSION}" \
              >/dev/null 2>&1; then
              READY=1
              break
            fi

            echo "Image not available yet. Attempt ${attempt}/20."
            sleep 30
          done

          if [ "${READY}" != "1" ]; then
            echo "Matching upstream Docker image is not available."
            exit 1
          fi

          sed -i -E \
            "s/^version: .*/version: \"${VERSION}\"/" \
            open-terminal/config.yaml

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Commit version update
        if: steps.upstream.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add open-terminal/config.yaml
          git commit -m "chore: update Open Terminal to ${VERSION}"
          git push
